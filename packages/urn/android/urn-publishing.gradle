// 仅生成本地候选 AAR，不向公共 Maven 发布，也不改变 npm/Pod 版本。
apply plugin: 'maven-publish'
group = 'com.urn.sdk'
version = '0.3.0-preview.1'
android { publishing { singleVariant('release') { withSourcesJar() } } }
publishing {
    repositories {
        maven {
            name = 'urnStaging'
            url = file(providers.gradleProperty('urnMavenStagingDir').getOrElse(
                rootProject.layout.buildDirectory.dir('urn-maven').get().asFile.path)).toURI()
        }
    }
}
afterEvaluate {
    publishing.publications {
        release(MavenPublication) {
            from components.release
            groupId = 'com.urn.sdk'
            artifactId = 'leo-urn'
            version = '0.3.0-preview.1'
            pom {
                name = 'LeoURN Android candidate'
                description = 'URN Android local validation artifact'
                licenses { license { name = 'MIT License'; url = 'https://opensource.org/licenses/MIT' } }
            }
        }
    }
}
